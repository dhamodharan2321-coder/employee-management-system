<!DOCTYPE html>
<html>
<head>
<title>Update Employee</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h2>Update Employee</h2>

<form action="/update/{{employee[0]}}" method="POST">

<input type="text" name="name" value="{{employee[1]}}">

<input type="email" name="email" value="{{employee[2]}}">

<input type="text" name="department" value="{{employee[3]}}">

<input type="number" name="salary" value="{{employee[4]}}">

<button type="submit">Update</button>

</form>

</body>
</html>
