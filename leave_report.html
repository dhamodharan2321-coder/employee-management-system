<!DOCTYPE html>
<html>
<head>
<title>Leave Report</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h2>Leave Report</h2>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>From</th>
<th>To</th>
<th>Reason</th>
</tr>

{% for leave in leaves %}

<tr>

<td>{{leave[0]}}</td>
<td>{{leave[1]}}</td>
<td>{{leave[2]}}</td>
<td>{{leave[3]}}</td>
<td>{{leave[4]}}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
