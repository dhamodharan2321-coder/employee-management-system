<!DOCTYPE html>
<html>
<head>

<title>HR Admin Dashboard</title>

<link rel="stylesheet" href="/static/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family: Arial;
background:#f4f6f9;
}

.sidebar{

width:220px;
height:100vh;
background:#2c3e50;
color:white;
position:fixed;
padding-top:20px;

}

.sidebar h2{
text-align:center;
margin-bottom:30px;
}

.sidebar a{

display:block;
color:white;
padding:12px;
text-decoration:none;
margin:5px;

}

.sidebar a:hover{

background:#34495e;

}

.main{

margin-left:240px;
padding:20px;

}

.cards{

display:flex;
gap:20px;
margin-bottom:30px;

}

.card{

flex:1;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
text-align:center;

}

.card h3{

margin-bottom:10px;

}

.chart-box{

background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);

}

</style>

</head>

<body>

<div class="sidebar">

<h2>HR Portal</h2>

<a href="/dashboard">Dashboard</a>

<a href="/add_employee">Add Employee</a>

<a href="/view_employee">View Employees</a>

<a href="/leave">Apply Leave</a>

<a href="/leave_report">Leave Reports</a>

</div>


<div class="main">

<h1>Admin Dashboard</h1>

<div class="cards">

<div class="card">

<h3>Total Employees</h3>

<h2>{{total_emp}}</h2>

</div>

<div class="card">

<h3>Total Leaves</h3>

<h2>{{total_leave}}</h2>

</div>

</div>


<div class="chart-box">

<h3>HR Statistics</h3>

<canvas id="hrChart"></canvas>

</div>

</div>


<script>

var ctx = document.getElementById('hrChart');

new Chart(ctx, {

type: 'bar',

data: {

labels: ['Employees','Leaves'],

datasets: [

{

label: 'Company Statistics',

data: [{{total_emp}}, {{total_leave}}],

backgroundColor: [

'#3498db',
'#2ecc71'

]

}

]

},

options: {

responsive:true,

plugins:{
legend:{
display:true
}
}

}

});

</script>

</body>

</html>
